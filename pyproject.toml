[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kandinsky-6-sr"
version = "1.0.0"
description = "Kandinsky 6 video super-resolution: tiled latent-upscaler + DiT inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "av>=18.0.0",
    "cyclopts>=4.22.0",
    "diffusers>=0.39.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.0.0",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "safetensors>=0.8.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
# FlashAttention-2 for the dense-flash self-attention and text cross-attention
# paths (built from source, needs nvcc). The nabla text-free release models
# never reach those paths, so it is optional; nn.py imports it lazily.
flash = [
    "flash-attn>=2.0.0",
]
# Optional Linux dependencies for the MagiCompiler KVAE backend.
# MagiCompiler itself is not on PyPI: install v1.1.0 separately as documented
# in README.md, or use `just setup-magi` in this checkout.
magi = [
    "cuda-python ; sys_platform == 'linux'",
    "depyf ; sys_platform == 'linux'",
    "graphviz ; sys_platform == 'linux'",
    "pydantic-settings ; sys_platform == 'linux'",
    "seaborn ; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/kandinskylab/kandinsky-6-sr"
Issues = "https://github.com/kandinskylab/kandinsky-6-sr/issues"

[project.scripts]
kandy-sr = "kandinsky_sr.cli:main"

[dependency-groups]
# Checkout-only Git dependency; excluded from published wheel requirements.
magi = ["magi_compiler ; sys_platform == 'linux'"]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.uv]
preview = true
# This repo's own environment pins the validated torch 2.10.0. The CUDA build is
# NOT pinned here: `[tool.uv.sources]` travels with the package to git consumers
# (k6_video pins its own torch index), so this repo's JUSTFILE selects the
# CUDA 12.8 wheels via UV_INDEX instead (NVIDIA drivers >= 12.8).
constraint-dependencies = ["torch==2.10.0", "torchvision==0.25.0"]
# flash-attn and MagiCompiler must NOT build in an isolated env: their
# build-system.requires pull torch (gigabytes) and can hang. With isolation off,
# the real build needs are supplied via extra-build-dependencies below.
no-build-isolation-package = [
    "flash-attn",
    "magi_compiler",
]

# MagiCompiler's setup needs torch/seaborn just to REPORT metadata; its
# wheel declares no runtime deps at all, so declare that statically and let uv
# lock the git ref without ever building the package.
[[tool.uv.dependency-metadata]]
name = "magi-compiler"
version = "1.1.0"
requires-dist = []

[tool.uv.extra-build-dependencies]
flash-attn = ["torch>=2.4.0", "setuptools", "packaging", "ninja"]
# Build requirements from MagiCompiler v1.1.0 (no isolated build).
magi-compiler = ["setuptools>=61.0", "wheel", "versioningit"]

[tool.uv.sources]
magi_compiler = { git = "https://github.com/SandAI-org/MagiCompiler.git", tag = "v1.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/kandinsky_sr"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kandinsky_sr",
    "README.md",
    "LICENSE",
    "LICENSE-APACHE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "PL", "B", "ERA", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kandinsky_sr", "kandinsky6_vsr"]

[tool.ruff.lint.per-file-ignores]
# ComfyUI custom node packs are named after their repo folder (hyphens included).
"comfyui/**" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
